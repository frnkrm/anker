name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: PC-Stopp mit PowerShell prüfen
        run: npm run test:pc
      - name: Android-Updateprüfung ohne echte Schlüssel testen
        run: python3 scripts/test-android-update.py
      - run: npm run build
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
      - name: Playwright-Browsertests
        id: e2e
        run: npm run test:e2e
      - name: Playwright-Fehlerberichte speichern
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fehlerberichte
          path: |
            playwright-report/
            test-results/
          retention-days: 7
