name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Logiktests mit überprüfbarer Zusammenfassung
        run: |
          npm test -- --reporter=default --reporter=json --outputFile=vitest-results.json
          python3 - <<'PY'
          import json, pathlib
          result = json.loads(pathlib.Path('vitest-results.json').read_text())
          passed, failed, skipped = (result[key] for key in ['numPassedTests', 'numFailedTests', 'numPendingTests'])
          if result.get('success') is not True or not isinstance(passed, int) or passed <= 0 or failed != 0 or skipped != 0:
              raise SystemExit('Die vollständige Logikprüfung ist nicht grün.')
          print(f'::notice title=Anker Vitest::{passed} passed; {failed} failed; {skipped} skipped')
          PY
      - name: Relaymigration und Zugriffsrechte mit lokalem PostgreSQL prüfen
        run: |
          npm install --prefix "$RUNNER_TEMP/anker-relay-sql" --no-save --ignore-scripts --package-lock=false @electric-sql/pglite@0.5.16
          node scripts/test-pc-relay-sql.mjs --module "$RUNNER_TEMP/anker-relay-sql/node_modules/@electric-sql/pglite/dist/index.js"
      - name: PC-Stopp mit PowerShell prüfen
        run: npm run test:pc
      - name: Android-Updateprüfung ohne echte Schlüssel testen
        run: python3 scripts/test-android-update.py
      - name: Play-Uploadgrenzen ohne Zugangsdaten prüfen
        run: |
          python3 scripts/test-google-play-upload.py
          python3 scripts/test-google-play-auth.py
          python3 scripts/test-google-play-workflow.py
      - run: npm run build
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
      - name: Playwright-Browsertests
        id: e2e
        run: npm run test:e2e
      - name: Playwright-Fehlerberichte speichern
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fehlerberichte
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  pc-companion:
    name: PC-Begleiter / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pc-companion/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Isolierte PC-Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r pc-companion/requirements.txt
      - name: Windows-Bibliotheken ohne Systemaktionen importieren
        if: runner.os == 'Windows'
        working-directory: pc-companion
        run: >-
          python -c "import tkinter; import pystray; import comtypes; import qrcode;
          from pycaw.pycaw import AudioUtilities;
          from anker_companion.windows import WindowsPlatform, MasterAudioDucker;
          from anker_companion.vault import DpapiVault;
          from anker_companion.ui import DesktopUI;
          print('Windows-Import erfolgreich; keine Fenster oder Systemaktionen gestartet.')"
      - name: PC-Protokoll und Windows-Grenzen mit Fake-Effekten prüfen
        working-directory: pc-companion
        # Tests inject clock, vault, Windows and audio boundaries. No real lock/shutdown.
        run: python -m unittest discover -s tests -v
      - name: CLI-Hilfe ohne Start des Begleiters prüfen
        working-directory: pc-companion
        run: python -m anker_companion --help
      - name: Node-Telefon gegen echten lokalen TLS-Server prüfen
        # Loopback-only server uses an injected test vault and fake Windows effects.
        run: node pc-companion/tests/node_phone_simulator.mjs
      - name: Windows-Quellpaket bauen und prüfen
        # Windows runs the installer mocks with Windows PowerShell 5.1; Ubuntu
        # uses pwsh. Neither path installs/registers tasks or invokes OS effects.
        run: |
          python scripts/test-pc-package.py
          python scripts/package-pc-companion.py --output dist-pc/Anker-PC-Begleiter-0.1.1.zip
      - name: Windows-Quellpaket speichern
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Anker-PC-Begleiter-Quellpaket
          path: |
            dist-pc/Anker-PC-Begleiter-0.1.1.zip
            dist-pc/Anker-PC-Begleiter-0.1.1.zip.sha256
          if-no-files-found: error
          retention-days: 14
